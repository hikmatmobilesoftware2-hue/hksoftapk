<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background with squircle radius -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Outer Ring Shield -->
  <rect x="36" y="36" width="440" height="440" rx="90" fill="none" stroke="#3b82f6" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Central Ledger Book Icon -->
  <g filter="url(#shadow)">
    <!-- Ledger Base Card -->
    <rect x="100" y="100" width="312" height="312" rx="36" fill="#0f172a" stroke="#38bdf8" stroke-width="6"/>
    
    <!-- Ledger spine -->
    <rect x="100" y="100" width="60" height="312" rx="16" fill="url(#accent)"/>
    
    <!-- Gold / White Ribbon / Lines -->
    <line x1="190" y1="160" x2="370" y2="160" stroke="#f8fafc" stroke-width="12" stroke-linecap="round"/>
    <line x1="190" y1="210" x2="340" y2="210" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
    <line x1="190" y1="260" x2="370" y2="260" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>

    <!-- PKR Symbol Badge -->
    <circle cx="280" cy="335" r="44" fill="#2563eb" stroke="#38bdf8" stroke-width="4"/>
    <text x="280" y="347" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">₨</text>
  </g>

  <!-- HLP Text in Spine -->
  <text x="130" y="270" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" transform="rotate(-90 130 270)" letter-spacing="4">HIKMAT</text>
</svg>